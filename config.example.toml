# Copy to $XDG_CONFIG_HOME/wayhud/config.toml.
#
# Every key with its type, default and range: man 5 wayhud
#
# [style.default] is the base for every other preset: a key a preset does not
# set is taken from there, and only then from the compiled-in default. Unknown
# keys are an error, so a typo tells you instead of quietly doing nothing.
#
# Sub-tables merge key by key, except when the preset changes a "kind" — a
# different vanish or reveal variant replaces the table outright, since the
# leftover keys would belong to the other variant.

[style.default]
# "Monospace" is a fontconfig generic and always resolves; a real family
# name has to match fontconfig exactly or it silently falls back.
font = "Monospace 72"
color = "#b8bb26"           # gruvbox bright green
outline = "#1d2021"         # gruvbox bg0_hard
# outline_width = 5.0      # omit to scale with the font size (size / 14)
# A halo behind the glyphs, drawn UNDER the outline rather than instead of it.
# Omit for none; radius = 0 switches off one inherited from here.
# glow = { color = "#b8bb26", radius = 12.0, alpha = 0.55 }
halign = "center"           # left | center | right
valign = "center"           # top  | center | bottom
margin = 64                 # to the SURFACE, not the text; anchored axes only
line_align = "left"         # alignment of lines inside the block
timeout_ms = 5000           # hold AFTER the reveal finishes
reveal = { kind = "typewriter", cps = 28, cursor = true }
# instant | fade | collapse | wash (dir = down|up) | untype | dissolve
vanish = { kind = "collapse", ms = 420 }
sound = { enabled = true, freq = 2100.0, decay_ms = 38.0, gain = 0.22, every = 1 }

[style.alert]
color = "#fb4934"           # gruvbox bright red
glow = { color = "#fb4934", radius = 18.0, alpha = 0.7 }
font = "Monospace 96"
timeout_ms = 8000
reveal = { kind = "typewriter", cps = 45, cursor = true }
vanish = { kind = "fade", ms = 250 }

[style.quiet]
reveal = { kind = "instant" }
vanish = { kind = "fade", ms = 200 }
sound = { enabled = false }

# Self-destructing message: types in, sits, then clicks its way back out.
[style.spy]
color = "#8ec07c"           # gruvbox bright aqua
reveal = { kind = "typewriter", cps = 18, cursor = true, jitter = 0.35 }
vanish = { kind = "untype", ms = 900 }

[style.wipe]
reveal = { kind = "instant" }
vanish = { kind = "wash", ms = 600, dir = "up" }
