# Copy to ~/.config/wayhud/config.toml, or $XDG_CONFIG_HOME/wayhud/config.toml.
# See man 5 wayhud for keys, defaults and ranges.
#
# Presets inherit from [style.default], then built-in defaults. Sub-tables
# merge by field; changing kind replaces the table. Unknown keys are errors.
# CLI flags override individual fields in the selected preset.

[style.default]
# Use the system monospace font. Check named families with fc-match.
font = "Monospace 72"
color = "#b8bb26"           # gruvbox bright green
outline = "#1d2021"         # gruvbox bg0_hard
# outline_width = 5.0      # omit to scale with font size (size / 14)
# Glow is drawn behind the outline. radius = 0 disables inherited glow.
# glow = { color = "#b8bb26", radius = 12.0, alpha = 0.55 }
# Raster bands over the finished message. period is in DEVICE pixels, so the
# pitch holds at any font size. strength = 0 disables an inherited raster.
# scanlines = { period = 4.0, strength = 0.35, duty = 0.5 }
halign = "center"           # left | center | right
valign = "center"           # top  | center | bottom
margin = 64                 # surface-to-edge gap; anchored axes only
line_align = "left"         # alignment of lines inside the block
# width = 800               # pin the block; unset wraps to the monitor
timeout_ms = 5000           # hold after reveal
# scroll = true keeps the current line at the bottom; see [style.boot].
reveal = { kind = "typewriter", cps = 28, cursor = true }
# instant | fade | collapse | wash (dir = down|up) | untype | dissolve
vanish = { kind = "collapse", ms = 420 }
sound = { enabled = true, freq = 2100.0, decay_ms = 38.0, gain = 0.22, every = 1 }

[style.alert]
color = "#fb4934"           # gruvbox bright red
glow = { color = "#fb4934", radius = 18.0, alpha = 0.7 }
font = "Monospace 96"
timeout_ms = 8000
reveal = { kind = "typewriter", cps = 45, cursor = true }
vanish = { kind = "fade", ms = 250 }

[style.quiet]
reveal = { kind = "instant" }
vanish = { kind = "fade", ms = 200 }
sound = { enabled = false }

# Typewriter reveal and reverse erase.
[style.spy]
color = "#8ec07c"           # gruvbox bright aqua
reveal = { kind = "typewriter", cps = 18, cursor = true, jitter = 0.35 }
vanish = { kind = "untype", ms = 900 }

# A tube in the corner: green phosphor, bloom, and a raster over both.
[style.crt]
font = "Monospace 40"
color = "#33ff33"
outline = "none"
glow = { color = "#33ff33", radius = 16.0, alpha = 0.75 }
scanlines = { period = 4.0, strength = 0.55, duty = 0.5 }
halign = "left"
valign = "bottom"
margin = 48
reveal = { kind = "typewriter", cps = 35, jitter = 0.2, scroll = true }
vanish = { kind = "collapse", ms = 500 }

[style.wipe]
reveal = { kind = "instant" }
vanish = { kind = "wash", ms = 600, dir = "up" }

# Scroll earlier lines up from the bottom-left corner.
[style.boot]
font = "Monospace 28"
halign = "left"
valign = "bottom"
margin = 32
reveal = { kind = "typewriter", cps = 40, cursor = true, scroll = true }
vanish = { kind = "fade", ms = 300 }
