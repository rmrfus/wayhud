name: Audit

# On a schedule, not only on push. An advisory published after the last commit
# is invisible until the next one, and for a tool that sits on a machine for
# months that is the normal case rather than the edge case.
#
# Accepted limitation, stated rather than left to be discovered: GitHub
# disables a scheduled workflow in a PUBLIC repository "when no repository
# activity has occurred in 60 days". That is the same dormancy this schedule
# exists to cover, so it stops in exactly the case that motivated it. Taken on
# the grounds that the weeks right after the last commit are when a fresh
# advisory against a still-current tree matters most, and that any push resets
# the clock. If that stops being good enough the run has to be driven from
# outside the repository; the workflow_dispatch below is what such a driver
# would call.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Advisories and sources
        run: nix develop --command cargo deny check advisories sources
