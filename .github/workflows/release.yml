name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Fetch tag annotations for --notes-from-tag.
          fetch-depth: 0

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Verify the tag builds. Binaries depend on host GTK and layer-shell libraries;
      # installation is through Nix or a source build.
      - name: Verify the tag builds
        run: nix build

      # Release notes come from the annotated tag; create it with git tag -a.
      - name: Publish
        run: |
          gh release delete "${GITHUB_REF_NAME}" --yes --repo "${GITHUB_REPOSITORY}" 2>/dev/null || true
          # --notes-from-tag requires local repository context and cannot use --repo.
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-from-tag
        env:
          GH_TOKEN: ${{ github.token }}
