name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Built through nix rather than rustup: this links against GTK4,
    # gtk4-layer-shell and libpulse, and the flake is the only place those are
    # pinned to versions known to work together. It also means CI compiles the
    # same way a user running `nix run github:rmrfus/wayhud` does.
    name: fmt · clippy · test · package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Format
        run: nix develop --command cargo fmt --all --check

      - name: Clippy
        run: nix develop --command cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: nix develop --command cargo test --locked

      - name: Man pages
        run: |
          nix develop --command groff -man -Tutf8 -ww -z man/man1/wayhud.1
          nix develop --command groff -man -Tutf8 -ww -z man/man5/wayhud.5

      # RustSec advisories against the committed lockfile. Covers what
      # cargo-audit does, so this is the only scanner here.
      - name: Advisories
        run: nix develop --command cargo deny check advisories

      # A dependency nothing imports is not a crash; it keeps appearing in the
      # advisory scan above for code that is no longer called, and can hold the
      # MSRV higher than our own source needs.
      - name: Unused dependencies
        run: nix develop --command cargo machete

      # Not just a local convenience: without this the flake rots quietly and
      # the breakage lands on whoever first runs `nix run github:rmrfus/wayhud`.
      - name: Package
        run: nix build
