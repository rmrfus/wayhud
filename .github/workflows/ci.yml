name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Use the flake's pinned Rust toolchain and native libraries.
    name: fmt · clippy · test · package
    runs-on: ubuntu-latest
    steps:
      # Pin actions to immutable commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Format
        run: nix develop --command cargo fmt --all --check

      - name: Clippy
        run: nix develop --command cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: nix develop --command cargo test --locked

      - name: Man pages
        run: |
          nix develop --command groff -man -Tutf8 -ww -z man/man1/wayhud.1
          nix develop --command groff -man -Tutf8 -ww -z man/man5/wayhud.5

      # Include sources to enforce deny.toml's unknown-git policy.
      - name: Advisories and sources
        run: nix develop --command cargo deny check advisories sources

      - name: Unused dependencies
        run: nix develop --command cargo machete

      # Build the package and run tests in the Nix sandbox.
      - name: Package
        run: nix build

  msrv:
    # Check the minimum compiler version independently of the devshell toolchain.
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Read the required version from Cargo.toml.
      - name: Read the declared floor
        id: floor
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Cargo.toml declares rust-version $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.floor.outputs.version }}

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Use native libraries from Nix and the requested compiler from rustup.
      - name: Check on the declared floor
        run: |
          nix develop --command rustup run "${{ steps.floor.outputs.version }}" \
            cargo check --all-targets --locked

  aarch64:
    # Use a native ARM runner and cached aarch64 packages.
    name: aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Package
        run: nix build
