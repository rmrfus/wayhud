[package]
name = "wayhud"
version = "0.4.0"
edition = "2024"
# Set by the gtk-rs family, which is the whole dependency tree's ceiling; our
# own code only needs 1.87 (is_multiple_of). Without this, a stable-but-older
# toolchain fails deep inside a dependency instead of saying what it needs.
rust-version = "1.92"
description = "Layer-shell text overlay for sway — sci-fi HUD messages"
license = "MIT"
homepage = "https://github.com/rmrfus/wayhud"
repository = "https://github.com/rmrfus/wayhud"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gtk-layer-shell = { package = "gtk4-layer-shell", version = "0.8" }
# Version must track the pango/cairo-rs that gtk4 pulls in (0.22.x), or the
# Layout/Context types won't be the same types.
pangocairo = "0.22"
serde = { version = "1", features = ["derive"] }
swayipc = "4"
toml = "0.8"
# Same audio path as blyamk: synth straight to PipeWire/PulseAudio, no assets.
libpulse-binding = "2"
libpulse-simple-binding = "2"

# The no-panic rule, machine-checked. These live in clippy's `restriction`
# group, which is allow-by-default and is not switched on by `clippy::all` or
# `pedantic` — each has to be named. `warn` plus the `-D warnings` CI already
# passes is what makes them fail; a crate-level `#![deny]` would poison
# #[cfg(test)] code and need an #[allow] on every test. See clippy.toml for the
# in-test exemptions.
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = true
strip = true
