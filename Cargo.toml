[package]
name = "wayhud"
version = "1.0.0"
edition = "2024"
# Required by gtk-rs dependencies.
rust-version = "1.92"
description = "Layer-shell text overlay for sway — sci-fi HUD messages"
license = "MIT"
homepage = "https://github.com/rmrfus/wayhud"
repository = "https://github.com/rmrfus/wayhud"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gtk-layer-shell = { package = "gtk4-layer-shell", version = "0.8" }
# Match the pango/cairo-rs versions used by gtk4 to keep types compatible.
pangocairo = "0.22"
serde = { version = "1", features = ["derive"] }
swayipc = "4"
toml = "0.8"

libpulse-binding = "2"
libpulse-simple-binding = "2"

# CI promotes these restriction lints to errors with -D warnings.
# Test exemptions are in clippy.toml.
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# Return ExitCode, keep diagnostics on stderr, and document unsafe blocks.
exit = "warn"
print_stdout = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

[profile.release]
lto = true
strip = true
